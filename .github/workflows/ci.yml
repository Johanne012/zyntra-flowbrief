name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f index.html
          test -f vercel.json
          test -f README.md

      - name: vercel.json must not blanket-rewrite to index.html
        run: |
          if grep -qE '"source"\s*:\s*"/\(\.\*\)"' vercel.json 2>/dev/null; then
            if grep -qE '"destination"\s*:\s*"/index\.html"' vercel.json; then
              echo "ERROR: blanket rewrite /(.*) -> /index.html breaks multi-page static sites"
              exit 1
            fi
          fi
          echo "vercel.json routing check passed"

      - name: HTML pages present
        run: |
          for f in index.html order.html about.html contact.html; do
            if [ -f "$f" ]; then echo "OK $f"; else echo "missing $f (optional)"; fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run order intake contract tests
        run: node --test tests/order-intake-contract.test.mjs tests/console-contract.test.mjs tests/ledger-contract.test.mjs tests/ledger-reversal-contract.test.mjs tests/provider-route-contract.test.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check order intake Edge Function
        run: deno check supabase/functions/zyntra-order-intake/index.ts

      - name: Type-check payment intent Edge Function
        run: deno check supabase/functions/zyntra-create-payment-intent/index.ts

      - name: Type-check disabled regional adapter
        run: deno check supabase/functions/zyntra-chargily-payments/index.ts

      - name: Type-check organization onboarding Edge Function
        run: deno check supabase/functions/zyntra-create-organization/index.ts

      - name: Type-check organization dashboard Edge Function
        run: deno check supabase/functions/zyntra-org-dashboard/index.ts

      - name: Type-check organization listing Edge Function
        run: deno check supabase/functions/zyntra-my-organizations/index.ts

      - name: Type-check browser console JavaScript
        run: node --check console/app.js

      - name: Type-check platform organization review Edge Function
        run: deno check supabase/functions/zyntra-review-organization/index.ts

      - name: Type-check ledger posting Edge Function
        run: deno check supabase/functions/zyntra-post-ledger/index.ts

      - name: Type-check ledger reversal Edge Function
        run: deno check supabase/functions/zyntra-reverse-ledger/index.ts

      - name: Type-check payment intent route governance API
        run: deno check supabase/functions/zyntra-create-payment-intent/index.ts
